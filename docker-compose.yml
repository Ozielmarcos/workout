version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: workout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: workout_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/workout_db"
      JWT_SECRET: "$6$9mXiirRRPlcw6w1O$/8G4F1RJf4x0KcToSX/tl3i02uuVYDczMaNKfpE9IGaEqAo/ok1mFi2r98rbO1X2V5FU1aA/Ow4D8UKlbGAr.."
      JWT_EXPIRES_IN: "7d"
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3000/api"
    container_name: workout_frontend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data: